name: Weekly XAU 500 Retraining Pipeline

# 1. กำหนดเงื่อนไขการรัน (Triggers)
on:
  schedule:
    # รันทุกวันเสาร์ เวลา 00:00 UTC (ประมาณ 7 โมงเช้าวันเสาร์ของไทย)
    - cron: '0 0 * * 6'
  workflow_dispatch: # อนุญาตให้เรากดปุ่ม "Run workflow" แบบแมนนวลได้จากหน้าเว็บ GitHub

# 2. กำหนดงานที่จะทำ (Jobs)
jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest # ใช้ Server ของ GitHub ที่เป็น Linux

    steps:
    # Step 1: ดึงโค้ดทั้งหมดจาก Repository ของเรามาที่ Server
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: ติดตั้ง Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Step 3: ติดตั้ง Library ที่จำเป็นจาก requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: รันสคริปต์ตามลำดับ Pipeline
    - name: Run Data Ingestion
      run: python src/data_ingestion.py

    - name: Run Preprocessing
      run: python src/preprocessing.py

    - name: Run Training & MLflow Logging
      run: python src/train.py

    # Step 5: (สำคัญมาก) เซฟโฟลเดอร์ mlruns ออกมาเป็น Artifact เพื่อให้เราโหลดไปดู UI ได้
    - name: Upload MLflow Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-logs
        path: mlruns/
        retention-days: 14 # เก็บไฟล์นี้ไว้ 14 วัน